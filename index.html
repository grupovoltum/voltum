<title>Voltum</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --volt:#12E56B; --volt-deep:#0EC65B; --volt-ink:#04331b;
    --panel:#0C0C0C; --panel-line:#242424;
    --bg:#F4F6FA; --card:#FFFFFF;
    --ink:#1A1F2E; --ink-soft:#5A657C; --ink-faint:#8A94A8;
    --line:#E3E8F0; --info:#3B82F6; --red:#E5484D; --amber:#E8890C;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  h1,h2,h3,.brand-name{font-family:'Space Grotesk',sans-serif}
  button{font-family:inherit}
  .hidden{display:none !important}

  /* ---------- LOGIN / BOOTSTRAP ---------- */
  #gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#15321f 0%,#0C0C0C 55%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .gate-box{width:100%;max-width:380px;background:#121212;border:1px solid var(--panel-line);border-radius:18px;padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .bolt{width:42px;height:42px;border-radius:11px;background:var(--volt);display:grid;place-items:center;color:var(--volt-ink);font-weight:800;font-size:22px;font-family:'Space Grotesk'}
  .gate-logo .brand-name{color:#fff;font-size:24px;font-weight:700;letter-spacing:.5px}
  .gate-sub{color:#8a8a8a;font-size:13px;margin:2px 0 22px 2px}
  .gate-label{color:#9aa;font-size:12px;margin:14px 2px 6px;display:block}
  .gate-input{width:100%;padding:12px 14px;background:#1b1b1b;border:1px solid #2c2c2c;border-radius:10px;color:#fff;font-size:15px;outline:none}
  .gate-input:focus{border-color:var(--volt)}
  .gate-input::placeholder{color:#555}
  .gate-btn{width:100%;margin-top:20px;padding:13px;background:var(--volt);color:var(--volt-ink);border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
  .gate-btn:hover{background:var(--volt-deep)}
  .gate-err{color:#ff6b6b;font-size:12.5px;text-align:center;min-height:16px;margin-top:12px}
  .gate-note{color:#777;font-size:12px;text-align:center;margin-top:14px;line-height:1.5}

  /* ---------- APP SHELL ---------- */
  #app{display:flex;min-height:100vh}
  .side{width:230px;background:var(--panel);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .side-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
  .side-brand .bolt{width:34px;height:34px;border-radius:9px;font-size:18px}
  .side-brand .brand-name{font-size:19px;color:#fff;font-weight:700}
  .side-brand .tag{font-size:9px;background:#1e1e1e;color:var(--volt);padding:2px 6px;border-radius:5px;letter-spacing:1px;font-weight:600}
  .nav-group{padding:10px 12px;flex:1;overflow-y:auto}
  .nav-label{font-size:10px;color:#5a5a5a;letter-spacing:1.5px;text-transform:uppercase;margin:14px 10px 6px}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;background:transparent;border:none;color:#bdbdbd;font-size:14px;border-radius:9px;cursor:pointer;text-align:left;transition:.12s}
  .nav-btn:hover{background:#171717;color:#fff}
  .nav-btn.active{background:var(--volt);color:var(--volt-ink);font-weight:600}
  .nav-btn svg{width:18px;height:18px;flex-shrink:0}
  .side-foot{padding:14px 16px;border-top:1px solid var(--panel-line)}
  .user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px;padding:6px;transition:.12s}
  .user-chip:hover{background:#171717}
  .avatar{width:34px;height:34px;border-radius:50%;background:#1e1e1e;color:var(--volt);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
  .user-chip .nm{font-size:13px;color:#fff;font-weight:500;line-height:1.2}
  .user-chip .rl{font-size:11px;color:#777}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:22px 30px 10px}
  .topbar h1{font-size:24px;font-weight:700}
  .topbar .desc{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
  .content{padding:14px 30px 40px;flex:1}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .card-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin-bottom:12px}
  .btn{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;cursor:pointer;transition:.12s;font-weight:500}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:600}
  .btn.primary:hover{background:var(--volt-deep)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--bg);color:var(--ink)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.danger{color:var(--red);border-color:#f3c9cb}
  .btn.danger:hover{background:#fdeef0}
  .btn-ico{background:transparent;border:none;color:var(--ink-faint);cursor:pointer;padding:5px;border-radius:6px;display:inline-grid;place-items:center}
  .btn-ico:hover{background:var(--bg);color:var(--ink)}
  .btn-ico.danger:hover{color:var(--red)}
  .btn-ico svg{width:17px;height:17px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:14px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--volt)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:9px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
  .pill.socio{background:#e2faef;color:#0a7d43}
  .pill.colaborador{background:#e6eef7;color:#2660b8}
  .pill.ninguno{background:#eef1f5;color:#8A94A8}
  .empty{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:34px 10px}

  .overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  .overlay.open{display:flex}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .modal-head h2{font-size:17px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:var(--volt)}

  .soon{border:1.5px dashed var(--line);border-radius:14px;padding:50px 20px;text-align:center;color:var(--ink-faint)}
  .soon .big{font-size:17px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;font-family:'Space Grotesk'}

  @media(max-width:720px){
    .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .side.open{transform:translateX(0)}
    .main{width:100%}
    .topbar{padding:16px 18px 8px}
    .content{padding:12px 18px 40px}
    .hamb{display:inline-grid !important}
    .grid2{grid-template-columns:1fr}
  }
  .hamb{display:none;place-items:center;background:var(--panel);color:#fff;border:none;width:40px;height:40px;border-radius:9px;cursor:pointer}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
  .scrim.open{display:block}

firebase.initializeApp({

var USUARIOS=[];
var CURRENT_USER=null;
var currentView='';

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s);};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function normUser(s){return (s||'').trim().toLowerCase();}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
async function sha256(txt){
  try{
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }catch(e){ return 'plain:'+txt; } // fallback si no hay crypto.subtle (http)
}
function toast(msg){
  var t=$('#toast');
  t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg);
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200);
}
function modal(html){ var o=$('#overlay'); o.innerHTML='<div class="modal">'+html+'</div>'; o.classList.add('open'); o.onclick=function(e){if(e.target===o)closeModal();}; }
function closeModal(){ var o=$('#overlay'); o.classList.remove('open'); o.innerHTML=''; }
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
function toggleSide(open){ $('#side').classList.toggle('open',open); $('#scrim').classList.toggle('open',open); }

/* ---------- ICONOS ---------- */
var ICO={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  obras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>',
  clientes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  presu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
};

/* ---------- MÓDULOS y permisos por rol ---------- */
var MODULOS={
  inicio:{label:'Inicio',ico:'home',title:'',desc:'',roles:['socio','colaborador']},
  obras:{label:'Obras',ico:'obras',title:'Obras',desc:'Obras en curso, ambientes y producción',roles:['socio','colaborador']},
  calendario:{label:'Calendario',ico:'cal',title:'Calendario',desc:'Agenda semanal del equipo',roles:['socio']},
  presupuestador:{label:'Presupuestador',ico:'presu',title:'Presupuestador',desc:'Generá presupuestos de mano de obra',roles:['socio']},
  empleados:{label:'Empleados',ico:'users',title:'Empleados',desc:'Tu equipo: oficios, colores y accesos',roles:['socio']}
};
var EMP_COLORS=['#3B82F6','#12C2A0','#8B5CF6','#F59E0B','#EC4899','#0EA5E9','#EF4444','#14B8A6','#6366F1','#F97316'];
function allowedModules(){ return Object.keys(MODULOS).filter(function(k){return MODULOS[k].roles.indexOf(CURRENT_USER.rol)>=0;}); }
function isSocio(){ return CURRENT_USER && CURRENT_USER.rol==='socio'; }

/* ============================================================
   ARRANQUE
   ============================================================ */
(async function boot(){
  try{
    var snap=await db.collection('usuarios').get();
    USUARIOS=snap.docs.map(function(d){return d.data();});
  }catch(e){
    $('#gate-loading').textContent='No se pudo conectar. Revisá tu internet y recargá.';
    return;
  }
  $('#gate-loading').classList.add('hidden');
  // ¿sesión recordada?
  var remembered=null;
  try{ remembered=localStorage.getItem('voltum:user'); }catch(e){}
  if(remembered){
    var u=USUARIOS.find(function(x){return x.id===remembered;});
    if(u){ enterApp(u); return; }
  }
  if(!USUARIOS.length){ showBoot(); } else { showLogin(); }
})();

function showLogin(){ $('#boot-form').classList.add('hidden'); $('#login-form').classList.remove('hidden'); $('#gate-sub').textContent='Ingresá con tu usuario'; $('#lg-user').focus(); }
function showBoot(){ $('#login-form').classList.add('hidden'); $('#boot-form').classList.remove('hidden'); $('#gate-sub').textContent='Configuración inicial'; }

async function doBootstrap(){
  var name=$('#bt-name').value.trim(), user=normUser($('#bt-user').value), pass=$('#bt-pass').value;
  var err=$('#bt-err'); err.textContent='';
  if(!name||!user||!pass){ err.textContent='Completá todos los campos.'; return; }
  var u={id:user,usuario:user,nombre:name,claveHash:await sha256(pass),rol:'socio',oficio:'',color:EMP_COLORS[0],creado:new Date().toISOString()};
  try{ await db.collection('usuarios').doc(user).set(u); USUARIOS.push(u); enterApp(u); }
  catch(e){ err.textContent='No se pudo crear: '+e.message; }
}

async function doLogin(){
  var user=normUser($('#lg-user').value), pass=$('#lg-pass').value;
  var err=$('#lg-err'); err.textContent='';
  if(!user||!pass){ err.textContent='Completá usuario y contraseña.'; return; }
  var u=USUARIOS.find(function(x){return x.usuario===user;});
  var h=await sha256(pass);
  if(!u || u.claveHash!==h){ err.textContent='Usuario o contraseña incorrectos.'; return; }
  try{ localStorage.setItem('voltum:user',u.id); }catch(e){}
  enterApp(u);
}

function logout(){
  if(!confirm('¿Cerrar sesión?'))return;
  try{ localStorage.removeItem('voltum:user'); }catch(e){}
  CURRENT_USER=null;
  $('#app').classList.add('hidden');
  $('#gate').classList.remove('hidden');
  $('#lg-user').value=''; $('#lg-pass').value=''; $('#lg-err').textContent='';
  showLogin();
}

function enterApp(u){
  CURRENT_USER=u;
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#u-avatar').textContent=initials(u.nombre);
  $('#u-name').textContent=u.nombre;
  $('#u-role').textContent=u.rol==='socio'?'Administrador':'Colaborador';
  buildNav();
  setupTareas();
  go('inicio');
  // escuchar cambios de usuarios en vivo (para permisos)
  db.collection('usuarios').onSnapshot(function(snap){
    USUARIOS=snap.docs.map(function(d){return d.data();});
    if(currentView==='empleados') renderEmpleados();
    if(currentView==='calendario') renderCalendario();
    var me=USUARIOS.find(function(x){return x.id===CURRENT_USER.id;});
    if(!me){ logout(); } // me borraron el usuario
  });
}

function buildNav(){
  var mods=allowedModules();
  var html='<div class="nav-label">Operación</div>';
  mods.forEach(function(k){
    var m=MODULOS[k];
    html+='<button class="nav-btn" data-mod="'+k+'" onclick="go(\''+k+'\')">'+ICO[m.ico]+'<span>'+m.label+'</span></button>';
  });
  $('#nav').innerHTML=html;
}

function go(mod){
  if(!MODULOS[mod] || allowedModules().indexOf(mod)<0) return;
  currentView=mod;
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active',b.dataset.mod===mod); });
  $('#view-title').textContent=MODULOS[mod].title;
  $('#view-desc').textContent=MODULOS[mod].desc;
  toggleSide(false);
  if(mod==='inicio') renderInicio();
  else if(mod==='obras'){ openObraId=null; setupObras(); renderObras(); }
  else if(mod==='calendario') renderCalendario();
  else if(mod==='presupuestador') renderPresupuestador();
  else if(mod==='empleados') renderEmpleados();
  else renderSoon(mod);
}

/* ============================================================
   MÓDULO INICIO (dashboard, según rol)
   ============================================================ */
var DASH={obras:[],clientes:[],presupuestos:[],movimientos:[],prod:{},loaded:false};
var INGRESOS_DASH=['cobro','ingreso','deposito'];
function fmtMoney(n){return '$ '+(Number(n)||0).toLocaleString('es-AR');}
function dashClienteNombre(id){var c=DASH.clientes.find(function(x){return x.id==id;});return c?c.nombre:'—';}
function obraActiva(o){return (o.estado||'').toLowerCase()!=='finalizada' && (o.estado||'').toLowerCase()!=='suspendida';}
function cobradoDe(oid){return DASH.movimientos.filter(function(m){return m.obraId==oid && INGRESOS_DASH.indexOf(m.tipo)>=0;}).reduce(function(a,b){return a+(Number(b.importe)||0);},0);}

function saludoFecha(){
  var d=new Date();
  var dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var f=dias[d.getDay()]+' '+d.getDate()+' de '+meses[d.getMonth()];
  return f.charAt(0).toUpperCase()+f.slice(1);
}
function rangoSemana(){
  var d=new Date(); var day=(d.getDay()+6)%7;
  var lun=new Date(d); lun.setDate(d.getDate()-day);
  var dom=new Date(lun); dom.setDate(lun.getDate()+6);
  var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return lun.getDate()+' '+m[lun.getMonth()]+' – '+dom.getDate()+' '+m[dom.getMonth()];
}

async function loadDash(){
  var tasks=[ db.collection('obras').get(), db.collection('clientes').get(), db.collection('obras_prod').get() ];
  if(isSocio()){ tasks.push(db.collection('presupuestos').get()); }
  var res=await Promise.all(tasks);
  DASH.obras=res[0].docs.map(function(d){return d.data();});
  DASH.clientes=res[1].docs.map(function(d){return d.data();});
  DASH.prod={}; res[2].docs.forEach(function(d){DASH.prod[d.id]=d.data();});
  DASH.presupuestos=(isSocio()&&res[3])?res[3].docs.map(function(d){return d.data();}):[];
  DASH.loaded=true;
}

async function renderInicio(){
  var nombre=(CURRENT_USER.nombre||'').split(/\s+/)[0]||'';
  $('#view-title').textContent='Hola, '+nombre+' 👋';
  $('#view-desc').textContent=saludoFecha();
  var c=$('#content');
  if(!DASH.loaded){
    c.innerHTML='<div class="empty">Cargando tu panel…</div>';
    try{ await loadDash(); }catch(e){ c.innerHTML='<div class="empty">No se pudo cargar el panel. Recargá la página.</div>'; return; }
  }
  if(isSocio()) renderInicioSocio(c); else renderInicioColab(c);
}
function refreshDash(){ DASH.loaded=false; renderInicio(); }

function kpi(label,valor,color){
  return '<div class="card" style="margin:0;padding:16px 18px">'+
    '<div style="font-size:26px;font-weight:800;font-family:\'Space Grotesk\';color:'+(color||'var(--ink)')+'">'+valor+'</div>'+
    '<div style="font-size:12px;color:var(--ink-faint);margin-top:2px">'+label+'</div></div>';
}

function semanaBlock(texto,titulo){
  return '<div class="card" style="border-left:3px solid var(--volt)">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
      '<div class="card-h" style="margin:0">'+(titulo||'Tus tareas de esta semana')+'</div>'+
      '<div style="font-size:12px;color:var(--ink-faint)">'+rangoSemana()+'</div></div>'+
    '<div style="color:var(--ink-soft);font-size:13.5px;line-height:1.5">'+texto+'</div></div>';
}

function obraRow(o){
  return '<div onclick="irAObra(\''+o.id+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer">'+
    '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+esc(o.nombre)+'</div>'+
    '<div style="font-size:12px;color:var(--ink-faint)">'+esc(dashClienteNombre(o.clienteId))+'</div></div>'+
    (o.etapa?'<span class="pill" style="background:var(--bg);color:var(--ink-soft)">'+esc(o.etapa)+'</span>':'')+
  '</div>';
}
function listaObrasCard(titulo,arr,emptyMsg,colapsable){
  if(!arr.length) return '<div class="card" style="padding:0;overflow:hidden"><div class="card-h" style="padding:16px 18px 16px">'+titulo+' · 0</div><div class="empty" style="padding:0 18px 20px">'+emptyMsg+'</div></div>';
  var rows=arr.map(obraRow).join('');
  if(colapsable){
    return '<div class="card" style="padding:0;overflow:hidden"><details><summary style="cursor:pointer;padding:16px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint)">'+titulo+' · '+arr.length+'</summary><div style="padding-bottom:6px">'+rows+'</div></details></div>';
  }
  return '<div class="card" style="padding:0;overflow:hidden"><div class="card-h" style="padding:16px 18px 0">'+titulo+' · '+arr.length+'</div><div style="padding-bottom:6px">'+rows+'</div></div>';
}
function listaPresuCard(arr){
  var header='<div class="card-h" style="color:var(--amber);padding:16px 18px '+(arr.length?'0':'8px')+'">Pendientes de confirmar · '+arr.length+'</div>';
  var body;
  if(!arr.length){ body='<div class="empty" style="padding:0 18px 20px">No hay presupuestos pendientes.</div>'; }
  else {
    body=arr.map(function(p){
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line)">'+
        '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+esc(p.obra||'(obra)')+'</div>'+
        '<div style="font-size:12px;color:var(--ink-faint)">'+esc(p.clienteNombre||'—')+'</div></div></div>';
    }).join('')+'<div style="font-size:12px;color:var(--ink-faint);padding:8px 18px 14px">Se confirman desde la app de Caja → Obras.</div>';
  }
  return '<div class="card" style="padding:0;overflow:hidden;border-left:3px solid var(--amber)">'+header+body+'</div>';
}
function renderInicioSocio(c){
  var obras=DASH.obras;
  var activas=obras.filter(function(o){return (o.estado||'activa').toLowerCase()==='activa';});
  var finalizadas=obras.filter(function(o){return (o.estado||'').toLowerCase()==='finalizada';});
  var obrasPend=obras.filter(function(o){return (o.estado||'').toLowerCase()==='pendiente';});
  var pend=DASH.presupuestos.filter(function(p){return p.estado==='pendiente';});
  var html='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn ghost sm" onclick="refreshDash()">↻ Actualizar</button></div>';
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px">'+
    kpi('Obras activas',activas.length,'var(--volt-deep)')+
    kpi('Finalizadas',finalizadas.length,'var(--ink-soft)')+
    kpi('Pendientes de confirmar',obrasPend.length,'var(--amber)')+
  '</div>';
  var _sem=tareasSemana(null);
  var _semc=_sem.length?_sem.map(function(t){var em=empById(t.empleadoId);return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)'+(t.hecha?';opacity:.55':'')+'"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px'+(t.hecha?';text-decoration:line-through':'')+'">'+esc(t.descripcion||'')+'</div><div style="font-size:12px;color:var(--ink-faint)">'+esc(obraNombreAny(t.obraId))+' · '+esc(em?em.nombre:'—')+'</div></div><div style="font-size:12px;color:var(--volt-deep);font-weight:600;white-space:nowrap">'+fmtFechaCorta(t.fecha)+'</div></div>';}).join(''):'<div style="color:var(--ink-soft);font-size:13.5px">No hay trabajo programado para esta semana todavía.</div>';
  html+=semanaBlock(_semc,'Agenda de esta semana');
  html+=listaObrasCard('Obras activas',activas,'No hay obras activas.',true);
  if(obrasPend.length) html+=listaObrasCard('Obras pendientes de confirmar',obrasPend,'No hay obras pendientes de confirmar.',true);
  html+=listaObrasCard('Finalizadas',finalizadas,'Todavía no hay obras finalizadas.',true);
  html+='<div class="card"><div class="card-h">Accesos rápidos</div><div style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn primary" onclick="go(\'presupuestador\')">Nuevo presupuesto</button>'+
    '<button class="btn" onclick="go(\'obras\')">Ver obras</button>'+
  '</div></div>';
  c.innerHTML=html;
}
function renderInicioColab(c){
  var activas=DASH.obras.filter(obraActiva);
  var html='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn ghost sm" onclick="refreshDash()">\u21bb Actualizar</button></div>';

  var _mias=tareasSemana(CURRENT_USER.id);
  var _cont=_mias.length?_mias.map(function(t){return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer" onclick="toggleTarea(\''+t.id+'\')"><div style="flex-shrink:0">'+chkBox(!!t.hecha)+'</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;'+(t.hecha?'color:var(--ink-faint);text-decoration:line-through':'')+'">'+esc(t.descripcion||'')+'</div><div style="font-size:12px;color:var(--ink-faint)">'+esc(obraNombreAny(t.obraId))+(t.ambiente?(' · '+esc(t.ambiente)):'')+'</div></div><div style="font-size:12px;color:var(--volt-deep);font-weight:600;white-space:nowrap">'+fmtFechaCorta(t.fecha)+'</div></div>';}).join(''):'<div style="color:var(--ink-soft);font-size:13.5px">No tenés tareas asignadas para esta semana.</div>';
  html+=semanaBlock(_cont);
  html+='<div class="card" style="padding:0;overflow:hidden">'+
    '<div class="card-h" style="padding:16px 18px 0">Obras activas</div>';
  if(activas.length){
    html+='<div style="padding:8px 0 6px">'+activas.map(function(o){
      return '<div onclick="irAObra(\''+o.id+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer">'+
        '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+esc(o.nombre)+'</div>'+
        '<div style="font-size:12px;color:var(--ink-faint)">'+esc(dashClienteNombre(o.clienteId))+'</div></div></div>';
    }).join('')+'</div>';
  } else {
    html+='<div class="empty">No hay obras activas por ahora.</div>';
  }
  html+='</div>';
  html+='<button class="btn primary" onclick="go(\'obras\')">Ir a Obras</button>';
  c.innerHTML=html;
}

/* ============================================================
   MÓDULO OBRAS  (obras compartidas con Caja + producción propia)
   Datos: obras/clientes = Firebase (compartido con Caja)
          producción (ambientes/checklist) = colección obras_prod
   ============================================================ */
var openObraId=null;
var OB={obras:[],clientes:[],prod:{},listening:false};
var OPEN_CHK={};
var obrasFilter='activas';
var AMBIENTES_PRESET=['Ingreso','Toilette','Cochera','Cocina','Living/Sala de estar','Dormitorio','Dormitorio suite','Baño suite','Baño','Lavadero','Patio','Asador','Terraza'];
var ETAPAS_AMB=[
  {key:'canalizacion',nombre:'Canalización',tareas:[
    {k:'replanteo',t:'Replanteo y marcado'},{k:'cajas',t:'Colocación de cajas'},
    {k:'tendido',t:'Canalización y tendido de mangueras/caños'},{k:'alim1',t:'Confirmar alimentación'}]},
  {key:'cableado',nombre:'Cableado',tareas:[
    {k:'cableado',t:'Cableado de bocas'},{k:'alim2',t:'Confirmar alimentación'}]},
  {key:'llaves',nombre:'Colocación de llaves e interruptores',tareas:[{k:'llaves',t:'Llaves e interruptores'}]},
  {key:'artefactos',nombre:'Colocación de artefactos de iluminación',tareas:[
    {k:'artef',t:'Artefactos de iluminación'},{k:'esp',t:'Bocas especiales',cond:'esp'}]},
  {key:'prueba',nombre:'Prueba de funcionamiento',tareas:[
    {k:'tabconx',t:'Conexión al tablero (térmica / disyuntor)'},{k:'encend',t:'Prueba de encendidos y de tomas'},
    {k:'disy',t:'Verificación de disyuntor y puesta a tierra'},{k:'repaso',t:'Repaso final / checklist de entrega'}]}
];
var BOCA_TIPOS_PRESET=['Puntos de luz','Tomacorrientes','Iluminación en losa','Aplique en pared','Climatización','Señales débiles'];
var ESPECIALES_TIPOS=['Climatización','Señales débiles'];
function ambEsp(a){var b=a.bocas||{};return ESPECIALES_TIPOS.reduce(function(s,t){return s+(+b[t]||0);},0);}
function obraTipos(p){ if(!p.tipos||!p.tipos.length) p.tipos=BOCA_TIPOS_PRESET.slice(); return p.tipos; }
function _ambTareasAplicables(a){var out=[];ETAPAS_AMB.forEach(function(e){e.tareas.forEach(function(tk){if(tk.cond==='esp'&&!(ambEsp(a)>0))return;out.push(tk.k);});});return out;}
function ambProgreso(a){var apl=_ambTareasAplicables(a);if(!apl.length)return 0;var h=apl.filter(function(k){return a.tareas&&a.tareas[k];}).length;return Math.round(h/apl.length*100);}
function obraBocasTotal(p){var t={};obraTipos(p).forEach(function(k){t[k]=0;});(p.ambientes||[]).forEach(function(a){var b=a.bocas||{};Object.keys(b).forEach(function(k){t[k]=(t[k]||0)+(+b[k]||0);});});return t;}

function setupObras(){
  if(OB.listening)return; OB.listening=true;
  db.collection('obras').onSnapshot(function(s){
    OB.obras=s.docs.map(function(d){return d.data();});
    OB.obras.sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'');});
    if(currentView==='obras')renderObras();
  },function(e){ if(currentView==='obras')$('#content').innerHTML='<div class="empty">No se pudieron cargar las obras.</div>'; });
  db.collection('clientes').onSnapshot(function(s){
    OB.clientes=s.docs.map(function(d){return d.data();});
    if(currentView==='obras')renderObras();
  });
  db.collection('obras_prod').onSnapshot(function(s){
    OB.prod={}; s.docs.forEach(function(d){OB.prod[d.id]=d.data();});
    if(currentView==='obras')renderObras();
  });
}

function obClienteNombre(id){var c=OB.clientes.find(function(x){return x.id==id;});return c?c.nombre:'—';}
function getProd(oid){ if(!OB.prod[oid])OB.prod[oid]={ambientes:[],tareasObra:{}}; if(!OB.prod[oid].ambientes)OB.prod[oid].ambientes=[]; if(!OB.prod[oid].tareasObra)OB.prod[oid].tareasObra={}; return OB.prod[oid]; }
function saveProd(oid){var p=getProd(oid);db.collection('obras_prod').doc(String(oid)).set({ambientes:p.ambientes,tareasObra:p.tareasObra},{merge:true}).catch(function(e){toast('Error al guardar: '+e.message);});}
function chkBox(on){return '<span style="width:20px;height:20px;flex-shrink:0;border:2px solid '+(on?'var(--volt)':'var(--line)')+';background:'+(on?'var(--volt)':'transparent')+';border-radius:6px;display:inline-grid;place-items:center">'+(on?'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--volt-ink)" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>':'')+'</span>';}
function estadoPill(e){var map={pendiente:['Pendiente de confirmar','#fff6e5','#b0760c'],activa:['Activa','#e2faef','#0a7d43'],finalizada:['Finalizada','#eef1f5','#5A657C'],suspendida:['Cancelada','#fdecec','#c0392b']};var m=map[(e||'activa').toLowerCase()]||[e,'#eef1f5','#5A657C'];return '<span style="flex-shrink:0;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:'+m[1]+';color:'+m[2]+'">'+esc(m[0])+'</span>';}

function userNombre(uid){var u=(typeof USUARIOS!=='undefined'?USUARIOS:[]).find(function(x){return x.id===uid;});return u?u.nombre:'—';}
function fmtFechaCorta(f){if(!f)return '';var p=f.split('-');var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return p[2]+' '+m[(+p[1]-1)];}
function etapaNombre(k){var e=ETAPAS_AMB.find(function(x){return x.key===k;});return e?e.nombre:k;}
function dashObraNombre(oid){var o=(DASH.obras||[]).find(function(x){return x.id==oid;});return o?o.nombre:'(obra)';}
function semanaRango2(){var d=new Date();var day=(d.getDay()+6)%7;var lun=new Date(d.getFullYear(),d.getMonth(),d.getDate());lun.setDate(lun.getDate()-day);var dom=new Date(lun);dom.setDate(lun.getDate()+6);return [lun,dom];}
function enSemana(fstr){if(!fstr)return false;var p=fstr.split('-');var f=new Date(+p[0],+p[1]-1,+p[2]);var r=semanaRango2();return f>=r[0]&&f<=r[1];}

function renderObras(){ if(openObraId)renderObraDetail(); else renderObrasList(); }

function setObrasFilter(f){ obrasFilter=f; renderObrasList(); }
function renderObrasList(){
  $('#view-title').textContent='Obras';
  $('#view-desc').textContent=MODULOS.obras.desc;
  var soc=isSocio(), c=$('#content');
  function _cat(o){var e=(o.estado||'activa').toLowerCase();if(e==='finalizada'||e==='suspendida')return 'archivo';if(e==='pendiente')return 'pendiente';return 'activas';}
  var activas=OB.obras.filter(function(o){return _cat(o)==='activas';});
  var pend=OB.obras.filter(function(o){return _cat(o)==='pendiente';});
  var archivo=OB.obras.filter(function(o){return _cat(o)==='archivo';});
  if(!soc) obrasFilter='activas';
  var lista= !soc ? activas : (obrasFilter==='archivo'?archivo:(obrasFilter==='pendiente'?pend:activas));
  var html='';
  if(soc){
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
      '<button class="btn sm '+(obrasFilter==='activas'?'primary':'')+'" onclick="setObrasFilter(\'activas\')">Activas · '+activas.length+'</button>'+
      '<button class="btn sm '+(obrasFilter==='pendiente'?'primary':'')+'" onclick="setObrasFilter(\'pendiente\')">Pendientes · '+pend.length+'</button>'+
      '<button class="btn sm '+(obrasFilter==='archivo'?'primary':'')+'" onclick="setObrasFilter(\'archivo\')">Archivadas · '+archivo.length+'</button>'+
      '<button class="btn primary sm" style="margin-left:auto" onclick="obraForm()">'+ICO.plus+' Nueva obra</button>'+
    '</div>';
  }
  var _em= (soc&&obrasFilter==='archivo')?'No hay obras finalizadas ni canceladas.':((soc&&obrasFilter==='pendiente')?'No hay obras pendientes de confirmar.':'No hay obras activas.');
  if(!lista.length){ html+='<div class="empty">'+_em+'</div>'; c.innerHTML=html; return; }
  var byCli={}; lista.forEach(function(o){var k=o.clienteId||'_';(byCli[k]=byCli[k]||[]).push(o);});
  Object.keys(byCli).sort(function(a,b){return obClienteNombre(a).localeCompare(obClienteNombre(b));}).forEach(function(k){
    var nombre=k==='_'?'Sin cliente':obClienteNombre(k);
    html+='<div style="margin-bottom:22px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div class="avatar" style="width:28px;height:28px;background:var(--bg);color:var(--volt-deep);font-size:11px">'+initials(nombre)+'</div><div style="font-weight:600">'+esc(nombre)+'</div></div>';
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">'+byCli[k].map(obraListCard).join('')+'</div></div>';
  });
  c.innerHTML=html;
}
function obraListCard(o){
  var p=OB.prod[o.id]||{ambientes:[]}; var amb=p.ambientes||[]; var nAmb=amb.length;
  var prog=nAmb?Math.round(amb.reduce(function(a,x){return a+ambProgreso(x);},0)/nAmb):0;
  return '<div class="card" style="margin:0;cursor:pointer" onclick="openObraDetail(\''+o.id+'\')">'+
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px"><div style="font-weight:600;font-size:14px;min-width:0">'+esc(o.nombre)+'</div>'+estadoPill(o.estado)+'</div>'+
    '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:10px">'+nAmb+' ambiente(s)</div>'+
    '<div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+prog+'%;background:var(--volt)"></div></div>'+
    '<div style="font-size:11px;color:var(--ink-faint);margin-top:5px">'+prog+'% de avance</div></div>';
}

function openObraDetail(id){ openObraId=id; renderObras(); window.scrollTo(0,0); }
function backToObras(){ openObraId=null; renderObras(); }

function renderObraDetail(){
  var o=OB.obras.find(function(x){return x.id===openObraId;});
  if(!o){ openObraId=null; return renderObrasList(); }
  var soc=isSocio(), c=$('#content'), p=getProd(o.id), tot=obraBocasTotal(p); var totalB=Object.keys(tot).reduce(function(s,k){return s+(+tot[k]||0);},0);
  $('#view-title').textContent=o.nombre; $('#view-desc').textContent=obClienteNombre(o.clienteId);
  var html='<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" onclick="backToObras()">'+ICO.back+' Volver</button>'+estadoPill(o.estado)+
    (soc?'<div style="margin-left:auto;display:flex;gap:6px"><button class="btn-ico" onclick="obraForm(\''+o.id+'\')">'+ICO.edit+'</button><button class="btn-ico danger" onclick="delObra(\''+o.id+'\')">'+ICO.trash+'</button></div>':'')+'</div>';
  if(o.notas)html+='<div class="card" style="border-left:3px solid var(--volt);font-size:13.5px;color:var(--ink-soft)">'+esc(o.notas)+'</div>';
  html+='<div class="card" style="background:var(--bg)"><div class="card-h">Tareas generales de la obra</div>'+
    taskRowObra(o.id,'acometida','Acometida',p)+taskRowObra(o.id,'tablero','Armado de tablero',p)+'</div>';
  var _tt=obraTipos(p);
  var _cells=_tt.map(function(tp){return '<div style="min-width:70px"><div style="font-size:20px;font-weight:800;font-family:\'Space Grotesk\'">'+(tot[tp]||0)+'</div><div style="font-size:11px;color:var(--ink-faint)">'+esc(tp)+'</div></div>';}).join('');
  html+='<div class="card"><div class="card-h">Total de bocas · suma de ambientes</div><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end">'+_cells+
    '<div style="margin-left:auto;text-align:right"><div style="font-size:24px;font-weight:800;font-family:\'Space Grotesk\';color:var(--volt-deep)">'+totalB+'</div><div style="font-size:12px;color:var(--ink-faint)">Total</div></div></div></div>';
  if(p.materiales&&p.materiales.length){ html+='<div class="card"><div class="card-h">Materiales necesarios · del presupuesto</div>'+p.materiales.map(function(m){return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px"><span>'+esc(m.nombre)+'</span><span style="font-family:\'Space Grotesk\';font-weight:700">'+m.cant+' '+esc(m.unidad||'')+'</span></div>';}).join('')+'</div>'; }
  if(!p.ambientes.length)html+='<div class="empty">Todavía no cargaste ambientes.'+(soc?' Sumá el primero 👇':'')+'</div>';
  else html+=p.ambientes.map(function(a){return ambienteCardHub(o.id,a,soc);}).join('');
  if(soc)html+='<button class="btn primary" style="margin-top:12px" onclick="addAmbienteMenu(\''+o.id+'\')">'+ICO.plus+' Agregar ambiente</button>';
  c.innerHTML=html;
}

function taskRowObra(oid,k,label,p){var on=!!(p.tareasObra&&p.tareasObra[k]);return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer" onclick="toggleTareaObra(\''+oid+'\',\''+k+'\')">'+chkBox(on)+'<span style="font-size:14px;'+(on?'color:var(--ink-faint);text-decoration:line-through':'')+'">'+label+'</span></div>';}

function ambienteCardHub(oid,a,soc){
  a.bocas=a.bocas||{}; a.tareas=a.tareas||{};
  var prog=ambProgreso(a);
  var checklist=ETAPAS_AMB.map(function(e){
    var tareas=e.tareas.filter(function(tk){return !(tk.cond==='esp'&&!(ambEsp(a)>0));});
    if(!tareas.length)return '';
    return '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin:12px 0 2px">'+e.nombre+'</div>'+
      tareas.map(function(tk){
        var on=!!a.tareas[tk.k];
        var asgHtml='';
        if(soc){
          var ex=findChkTarea(oid,a.id,tk.k);
          if(ex){ var em=empById(ex.empleadoId); asgHtml='<button class="btn sm" style="padding:2px 8px;font-size:11px;white-space:nowrap" onclick="event.stopPropagation();asignarTarea(\''+oid+'\',\''+a.id+'\',\''+e.key+'\',\''+tk.k+'\')">'+esc(em?em.nombre.split(' ')[0]:'—')+(ex.fecha?(' · '+fmtFechaCorta(ex.fecha)):'')+'</button>'; }
          else { asgHtml='<button class="btn ghost sm" style="padding:2px 8px;font-size:11px;white-space:nowrap" onclick="event.stopPropagation();asignarTarea(\''+oid+'\',\''+a.id+'\',\''+e.key+'\',\''+tk.k+'\')">Asignar</button>'; }
        }
        return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0">'+
          '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer" onclick="toggleTareaAmb(\''+oid+'\',\''+a.id+'\',\''+tk.k+'\')">'+chkBox(on)+'<span style="font-size:13px;'+(on?'color:var(--ink-faint);text-decoration:line-through':'')+'">'+tk.t+'</span></div>'+asgHtml+'</div>';
      }).join('');
  }).join('');
  var _tipos=obraTipos(getProd(oid));
  var bocaInputs=_tipos.map(function(tp){var tpj=tp.replace(/'/g,"\\'");
    return '<label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-soft)">'+esc(tp)+'<input type="number" min="0" value="'+(a.bocas&&a.bocas[tp]?a.bocas[tp]:0)+'" '+(soc?'':'disabled')+' onchange="setBoca(\''+oid+'\',\''+a.id+'\',\''+tpj+'\',this.value)" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px"></label>';}).join('');
  if(soc)bocaInputs+='<button class="btn sm" style="align-self:flex-end;margin-bottom:2px" onclick="addBocaTipo(\''+oid+'\')">+ tipo</button>';
  return '<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="font-weight:600;font-size:15px;flex:1;min-width:0">'+esc(a.nombre)+'</div><div style="font-size:12px;color:var(--ink-faint)">'+prog+'%</div>'+
    (soc?'<button class="btn-ico" onclick="renameAmbiente(\''+oid+'\',\''+a.id+'\')">'+ICO.edit+'</button><button class="btn-ico danger" onclick="delAmbiente(\''+oid+'\',\''+a.id+'\')">'+ICO.trash+'</button>':'')+'</div>'+
    '<div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:'+prog+'%;background:var(--volt)"></div></div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px">'+bocaInputs+'</div>'+
    '<details '+(OPEN_CHK[a.id]?'open':'')+' ontoggle="OPEN_CHK[\''+a.id+'\']=this.open" style="margin-top:8px"><summary style="cursor:pointer;font-size:13px;color:var(--info)">Checklist de tareas</summary>'+checklist+'</details></div>';
}

/* ---- mutaciones de producción ---- */
function toggleTareaObra(oid,k){var p=getProd(oid);p.tareasObra[k]=!p.tareasObra[k];saveProd(oid);renderObras();}
function toggleTareaAmb(oid,aid,k){var p=getProd(oid);var a=p.ambientes.find(function(x){return x.id===aid;});if(!a)return;a.tareas=a.tareas||{};a.tareas[k]=!a.tareas[k];saveProd(oid);var lk=findChkTarea(oid,aid,k);if(lk&&lk.hecha!==a.tareas[k]){db.collection('tareas').doc(String(lk.id)).set({hecha:a.tareas[k]},{merge:true}).catch(function(){});}renderObras();}
function setBoca(oid,aid,tipo,val){if(!isSocio())return;var p=getProd(oid);var a=p.ambientes.find(function(x){return x.id===aid;});if(!a)return;a.bocas=a.bocas||{};a.bocas[tipo]=Math.max(0,parseInt(val)||0);saveProd(oid);renderObras();}
function addBocaTipo(oid){var nombre=prompt('Nombre del nuevo tipo de boca:');if(nombre===null)return;nombre=nombre.trim();if(!nombre)return;var p=getProd(oid);var tipos=obraTipos(p);if(tipos.some(function(t){return t.toLowerCase()===nombre.toLowerCase();})){toast('Ese tipo ya existe');return;}tipos.push(nombre);p.tipos=tipos;saveProd(oid);renderObras();}
function addAmbienteMenu(oid){
  var opts=AMBIENTES_PRESET.map(function(n){return '<button class="btn sm" style="margin:3px" onclick="addAmbiente(\''+oid+'\',\''+n.replace(/'/g,"\\'")+'\')">'+n+'</button>';}).join('');
  modal('<div class="modal-head"><h2>Agregar ambiente</h2><button class="btn-ico" onclick="closeModal()">'+ICO.x+'</button></div>'+
    '<div class="modal-body"><div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:16px">'+opts+'</div>'+
    '<div class="field"><label>Otro (nombre personalizado)</label><input id="amb-otro" placeholder="Ej: Quincho, Entrepiso..." onkeydown="if(event.key===\'Enter\'){addAmbiente(\''+oid+'\',this.value)}"></div></div>'+
    '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="addAmbiente(\''+oid+'\',document.getElementById(\'amb-otro\').value)">Agregar "Otro"</button></div>');
}
function addAmbiente(oid,nombre){nombre=(nombre||'').trim();if(!nombre)return;var p=getProd(oid);var final=nombre,n=2;while(p.ambientes.some(function(a){return a.nombre===final;})){final=nombre+' '+n;n++;}p.ambientes.push({id:uid(),nombre:final,bocas:{},tareas:{}});saveProd(oid);closeModal();renderObras();}
function delAmbiente(oid,aid){if(!confirm('¿Quitar este ambiente? Se pierden sus bocas y tildes.'))return;var p=getProd(oid);p.ambientes=p.ambientes.filter(function(a){return a.id!==aid;});saveProd(oid);renderObras();}

async function saveEmpleado(id){
  var name=$('#f-name').value.trim(), oficio=$('#f-oficio').value.trim(), color=$('#f-color').value, acc=$('#f-acc').value;
  var passEl=$('#f-pass'), pass=passEl?passEl.value:'';
  var userEl=$('#f-user'), user=(acc!=='ninguno'&&userEl)?normUser(userEl.value):'';
  if(!name){ alert('El nombre es obligatorio.'); return; }
  if(id){
    var u=USUARIOS.find(function(x){return x.id===id;}); if(!u)return;
    var upd={nombre:name,oficio:oficio,color:color,rol:acc};
    if(acc==='ninguno'){ upd.usuario=''; upd.claveHash=''; }
    else {
      if(!u.usuario){ if(!user){alert('Poné un usuario para el acceso.');return;} if(USUARIOS.some(function(x){return x.id!==id && x.usuario===user;})){alert('Ese usuario ya existe.');return;} upd.usuario=user; if(!pass){alert('Poné una contraseña.');return;} }
      if(pass) upd.claveHash=await sha256(pass);
    }
    try{ await db.collection('usuarios').doc(id).set(upd,{merge:true}); closeModal(); toast('Empleado actualizado'); }catch(e){ alert('Error: '+e.message); }
  } else {
    var nid=uid();
    var nu={id:nid,nombre:name,oficio:oficio,color:color,rol:acc,usuario:'',claveHash:'',creado:new Date().toISOString()};
    if(acc!=='ninguno'){
      if(!user){ alert('Poné un usuario.'); return; }
      if(!pass){ alert('Poné una contraseña.'); return; }
      if(USUARIOS.some(function(x){return x.usuario===user;})){ alert('Ya existe un usuario con ese nombre de acceso.'); return; }
      nu.usuario=user; nu.claveHash=await sha256(pass);
    }
    try{ await db.collection('usuarios').doc(nid).set(nu); closeModal(); toast('Empleado creado'); }catch(e){ alert('Error: '+e.message); }
  }
}
function delEmpleado(id){
  var u=USUARIOS.find(function(x){return x.id===id;}); if(!u)return;
  if(u.id===CURRENT_USER.id){ alert('No podés eliminar tu propio usuario.'); return; }
  var socios=USUARIOS.filter(function(x){return x.rol==='socio';});
  if(u.rol==='socio' && socios.length<=1){ alert('No podés eliminar al único administrador.'); return; }
  if(!confirm('¿Quitar a '+u.nombre+'?'))return;
  db.collection('usuarios').doc(id).delete().then(function(){toast('Empleado eliminado');}).catch(function(e){alert('Error: '+e.message);});
}

/* ============================================================
   TAREAS (asignaciones) + CALENDARIO semanal
   Colección Firestore: tareas
   Cada tarea: {id, obraId(REQ), empleadoId, fecha(YYYY-MM-DD), descripcion,
                hecha, origen:'libre'|'checklist', ambienteId?, ambiente?,
                etapaKey?, tareaKey?, creado}
   ============================================================ */
var TAREAS=[]; var TAREAS_LISTENING=false; var CAL_OFF=0;
function byNombre(a,b){return (a.nombre||'').localeCompare(b.nombre||'');}
function empById(id){return (USUARIOS||[]).find(function(x){return x.id===id;});}
function allObras(){return (OB.obras&&OB.obras.length)?OB.obras:(DASH.obras||[]);}
function obraNombreAny(oid){var o=allObras().find(function(x){return x.id==oid;});return o?o.nombre:'(obra)';}
function obrasAsignables(curId){return allObras().filter(function(o){var e=(o.estado||'activa').toLowerCase();return e==='activa'||e==='pendiente'||o.id===curId;});}

function setupTareas(){
  if(TAREAS_LISTENING)return; TAREAS_LISTENING=true;
  db.collection('tareas').onSnapshot(function(s){
    TAREAS=s.docs.map(function(d){return d.data();});
    if(currentView==='calendario')renderCalendario();
    else if(currentView==='inicio')renderInicio();
    else if(currentView==='obras')renderObras();
  },function(e){});
}

/* ---- fechas ---- */
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekMonday(off){var d=new Date();var day=(d.getDay()+6)%7;var lun=new Date(d.getFullYear(),d.getMonth(),d.getDate());lun.setDate(lun.getDate()-day+(off||0)*7);return lun;}
function weekDays(off){var lun=weekMonday(off);var arr=[];for(var i=0;i<6;i++){var x=new Date(lun);x.setDate(lun.getDate()+i);arr.push(x);}return arr;}
function fmtRango(a,b){var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return a.getDate()+' '+m[a.getMonth()]+' – '+b.getDate()+' '+m[b.getMonth()];}

/* ---- consultas para dashboard ---- */
function tareasSemana(filtroUid){return TAREAS.filter(function(t){if(!t.fecha)return false;if(filtroUid&&t.empleadoId!==filtroUid)return false;return enSemana(t.fecha);}).sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');});}

/* ---- crear / editar tarea libre ---- */
function tareaModal(opts){
  opts=opts||{};
  var t=opts.id?TAREAS.find(function(x){return x.id===opts.id;}):null;
  var locked=!!(t&&t.origen==='checklist');
  var curObra=t?t.obraId:(opts.obraId||'');
  var curEmp=t?t.empleadoId:(opts.empleadoId||'');
  var curFecha=t?t.fecha:(opts.fecha||'');
  var curDesc=t?(t.descripcion||''):'';
  var oOpts='<option value="">— Elegí una obra —</option>'+obrasAsignables(curObra).slice().sort(byNombre).map(function(o){return '<option value="'+o.id+'"'+(curObra===o.id?' selected':'')+'>'+esc(o.nombre)+'</option>';}).join('');
  var eOpts='<option value="">— Elegí empleado —</option>'+(USUARIOS||[]).slice().sort(byNombre).map(function(u){return '<option value="'+u.id+'"'+(curEmp===u.id?' selected':'')+'>'+esc(u.nombre)+'</option>';}).join('');
  var obraField=locked
    ? '<div class="field"><label>Obra</label><input value="'+esc(obraNombreAny(curObra))+'" disabled style="opacity:.6"></div>'
    : '<div class="field"><label>Obra</label><select id="t-obra">'+oOpts+'</select></div>';
  var descField=locked
    ? '<div class="field"><label>Tarea</label><input value="'+esc(curDesc)+'" disabled style="opacity:.6"></div>'
    : '<div class="field"><label>¿Qué hay que hacer?</label><input id="t-desc" value="'+esc(curDesc)+'" placeholder="Ej: Cablear circuito de tomas"></div>';
  modal('<div class="modal-head"><h2>'+(t?'Editar tarea':'Nueva tarea')+'</h2><button class="btn-ico" onclick="closeModal()">'+ICO.x+'</button></div>'+
    '<div class="modal-body">'+
      obraField+descField+
      '<div class="grid2">'+
        '<div class="field"><label>Empleado</label><select id="t-emp">'+eOpts+'</select></div>'+
        '<div class="field"><label>Fecha</label><input type="date" id="t-fecha" value="'+curFecha+'"></div>'+
      '</div>'+
      (locked?'<div style="font-size:12px;color:var(--ink-faint)">Esta tarea viene del checklist de la obra. Podés cambiar el empleado y la fecha.</div>':'')+
    '</div>'+
    '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveTarea(\''+(t?t.id:'')+'\')">'+(t?'Guardar':'Crear tarea')+'</button></div>');
}
function saveTarea(id){
  var existing=id?TAREAS.find(function(x){return x.id===id;}):null;
  var locked=!!(existing&&existing.origen==='checklist');
  var obraEl=document.getElementById('t-obra'), descEl=document.getElementById('t-desc');
  var obraId=locked?existing.obraId:(obraEl?obraEl.value:'');
  var desc=locked?existing.descripcion:(descEl?descEl.value.trim():'');
  var empleadoId=document.getElementById('t-emp').value;
  var fecha=document.getElementById('t-fecha').value;
  if(!obraId){alert('Elegí una obra. Las tareas van siempre ligadas a una obra.');return;}
  if(!desc){alert('Escribí qué hay que hacer.');return;}
  if(!empleadoId){alert('Elegí a quién se la asignás.');return;}
  if(!fecha){alert('Poné una fecha.');return;}
  if(id){
    db.collection('tareas').doc(String(id)).set({obraId:obraId,descripcion:desc,empleadoId:empleadoId,fecha:fecha},{merge:true}).then(function(){toast('Tarea actualizada');}).catch(function(e){alert('Error: '+e.message);});
  } else {
    var nid=uid();
    db.collection('tareas').doc(nid).set({id:nid,obraId:obraId,descripcion:desc,empleadoId:empleadoId,fecha:fecha,hecha:false,origen:'libre',creado:new Date().toISOString()}).then(function(){toast('Tarea creada');}).catch(function(e){alert('Error: '+e.message);});
  }
  closeModal();
}
function delTarea(id){
  var t=TAREAS.find(function(x){return x.id===id;}); if(!t)return;
  if(!confirm('¿Eliminar esta tarea?'))return;
  db.collection('tareas').doc(String(id)).delete().then(function(){toast('Tarea eliminada');}).catch(function(e){alert('Error: '+e.message);});
  closeModal();
}
function toggleTarea(id){
  var t=TAREAS.find(function(x){return x.id===id;}); if(!t)return;
  var nv=!t.hecha; t.hecha=nv;
  db.collection('tareas').doc(String(id)).set({hecha:nv},{merge:true}).catch(function(e){alert('Error: '+e.message);});
  if(t.origen==='checklist'&&t.ambienteId&&t.tareaKey){
    var p=OB.prod[t.obraId];
    if(p&&p.ambientes){var a=p.ambientes.find(function(x){return x.id===t.ambienteId;});if(a){a.tareas=a.tareas||{};if(a.tareas[t.tareaKey]!==nv){a.tareas[t.tareaKey]=nv;saveProd(t.obraId);}}}
  }
  if(currentView==='inicio')renderInicio();
  else if(currentView==='calendario')renderCalendario();
  else if(currentView==='obras')renderObras();
}

  var emp=empById(t.empleadoId);
  modal('<div class="modal-head"><h2>Tarea</h2><button class="btn-ico" onclick="closeModal()">'+ICO.x+'</button></div>'+

    '<div class="modal-foot"><button class="btn danger ghost" style="margin-right:auto" onclick="delTarea(\''+t.id+'\')">Eliminar</button><button class="btn" onclick="tareaModal({id:\''+t.id+'\'})">Editar</button><button class="btn primary" onclick="closeModal()">Cerrar</button></div>');
}

/* ---- asignación desde el checklist de la obra (por tarea) ---- */
function findChkTarea(oid,aid,tk){return TAREAS.find(function(t){return t.origen==='checklist'&&t.obraId===oid&&t.ambienteId===aid&&t.tareaKey===tk;});}
function asignarTarea(oid,aid,ek,tk){
  var p=getProd(oid);var a=p.ambientes.find(function(x){return x.id===aid;});if(!a)return;
  var et=ETAPAS_AMB.find(function(x){return x.key===ek;});var task=et&&et.tareas.find(function(x){return x.k===tk;});var label=task?task.t:tk;
  var ex=findChkTarea(oid,aid,tk);
  var curEmp=ex?ex.empleadoId:''; var curFecha=ex?ex.fecha:'';
  var eOpts='<option value="">— Nadie (quitar) —</option>'+(USUARIOS||[]).slice().sort(byNombre).map(function(u){return '<option value="'+u.id+'"'+(curEmp===u.id?' selected':'')+'>'+esc(u.nombre)+'</option>';}).join('');
  modal('<div class="modal-head"><h2>Asignar tarea</h2><button class="btn-ico" onclick="closeModal()">'+ICO.x+'</button></div>'+
    '<div class="modal-body">'+
      '<div style="font-weight:700;font-size:15px;margin-bottom:4px">'+esc(label)+'</div>'+
      '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">'+esc(a.nombre)+' · '+esc(etapaNombre(ek))+'</div>'+
      '<div class="grid2">'+
        '<div class="field"><label>Empleado</label><select id="a-emp">'+eOpts+'</select></div>'+
        '<div class="field"><label>Fecha</label><input type="date" id="a-fecha" value="'+curFecha+'"></div>'+
      '</div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAsignTarea(\''+oid+'\',\''+aid+'\',\''+ek+'\',\''+tk+'\')">Guardar</button></div>');
}
function saveAsignTarea(oid,aid,ek,tk){
  var emp=document.getElementById('a-emp').value, fecha=document.getElementById('a-fecha').value;
  var ex=findChkTarea(oid,aid,tk);
  if(!emp){ if(ex){db.collection('tareas').doc(String(ex.id)).delete().then(function(){toast('Asignación quitada');}).catch(function(){});} closeModal(); return; }
  if(!fecha){alert('Poné una fecha.');return;}
  var p=getProd(oid);var a=p.ambientes.find(function(x){return x.id===aid;});
  var et=ETAPAS_AMB.find(function(x){return x.key===ek;});var task=et&&et.tareas.find(function(x){return x.k===tk;});var label=task?task.t:tk;
  var hecha=!!(a&&a.tareas&&a.tareas[tk]);
  if(ex){
    db.collection('tareas').doc(String(ex.id)).set({empleadoId:emp,fecha:fecha},{merge:true}).then(function(){toast('Asignada');}).catch(function(e){alert('Error: '+e.message);});
  } else {
    var nid=uid();
    db.collection('tareas').doc(nid).set({id:nid,obraId:oid,ambienteId:aid,ambiente:(a?a.nombre:''),etapaKey:ek,tareaKey:tk,descripcion:label,empleadoId:emp,fecha:fecha,hecha:hecha,origen:'checklist',creado:new Date().toISOString()}).then(function(){toast('Asignada');}).catch(function(e){alert('Error: '+e.message);});
  }
  closeModal();
}

/* ---- CALENDARIO (semanal) ---- */
function calWeek(delta){CAL_OFF+=delta;renderCalendario();}
function calToday(){CAL_OFF=0;renderCalendario();}
function irAObra(id){ if((!OB.obras||!OB.obras.length)&&DASH.obras&&DASH.obras.length){OB.obras=DASH.obras.slice();OB.clientes=DASH.clientes.slice();OB.prod=Object.assign({},DASH.prod);} go('obras'); openObraId=id; renderObras(); window.scrollTo(0,0); }
function tareaChip(t,col){
  var done=!!t.hecha; var bg=col+(done?'14':'22');
  return '<div onclick="tareaMenu(\''+t.id+'\')" title="'+esc(t.descripcion||'')+'" style="cursor:pointer;background:'+bg+';border-left:3px solid '+col+';border-radius:6px;padding:5px 7px;line-height:1.25;'+(done?'opacity:.55':'')+'">'+
    '<div style="font-weight:600;font-size:11px;color:var(--ink)'+(done?';text-decoration:line-through':'')+'">'+esc(t.descripcion||'')+'</div>'+
    '<div style="font-size:10px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(obraNombreAny(t.obraId))+(t.ambiente?(' · '+esc(t.ambiente)):'')+'</div></div>';
}
function renderCalendario(){
  if(!isSocio()){ $('#content').innerHTML='<div class="empty">Solo disponible para administradores.</div>'; return; }
  var c=$('#content');
  if(!DASH.loaded){ c.innerHTML='<div class="empty">Cargando agenda…</div>'; loadDash().then(renderCalendario).catch(function(){c.innerHTML='<div class="empty">No se pudo cargar la agenda.</div>';}); return; }
  var days=weekDays(CAL_OFF); var diasN=['Lun','Mar','Mié','Jue','Vie','Sáb']; var hoy=isoDate(new Date());
  var head='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" onclick="calWeek(-1)">‹</button>'+
    '<button class="btn sm" onclick="calToday()">Hoy</button>'+
    '<button class="btn ghost sm" onclick="calWeek(1)">›</button>'+
    '<div style="font-weight:600;margin-left:6px">'+fmtRango(days[0],days[5])+'</div>'+
    '<button class="btn primary sm" style="margin-left:auto" onclick="tareaModal({})">'+ICO.plus+' Nueva tarea</button>'+
  '</div>';
  var emps=(USUARIOS||[]).slice().sort(byNombre);
  var thead='<th style="position:sticky;left:0;background:var(--card);z-index:2;min-width:140px">Empleado</th>'+days.map(function(d,i){return '<th'+(isoDate(d)===hoy?' style="color:var(--volt-deep)"':'')+'>'+diasN[i]+' '+d.getDate()+'</th>';}).join('');
  var body=emps.map(function(u){
    var col=u.color||'#8A94A8';
    var cells=days.map(function(d){
      var iso=isoDate(d);
      var mine=TAREAS.filter(function(t){return t.empleadoId===u.id&&t.fecha===iso;}).sort(function(a,b){return (a.descripcion||'').localeCompare(b.descripcion||'');});
      var chips=mine.map(function(t){return tareaChip(t,col);}).join('');
      return '<td style="background:'+(iso===hoy?'var(--bg)':'transparent')+'"><div style="display:flex;flex-direction:column;gap:5px;min-width:130px">'+chips+'<button class="cal-add" onclick="tareaModal({empleadoId:\''+u.id+'\',fecha:\''+iso+'\'})">+</button></div></td>';
    }).join('');
    return '<tr><td style="position:sticky;left:0;background:var(--card);z-index:1"><div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:'+col+';flex-shrink:0"></span><div style="min-width:0"><div style="font-weight:600;font-size:13px">'+esc(u.nombre)+'</div><div style="font-size:11px;color:var(--ink-faint)">'+esc(u.oficio||'')+'</div></div></div></td>'+cells+'</tr>';
  }).join('');
  var obrasAP=allObras().filter(function(o){var e=(o.estado||'activa').toLowerCase();return e==='activa'||e==='pendiente';}).sort(byNombre);
  var listHtml=obrasAP.length?obrasAP.map(function(o){
    return '<div onclick="irAObra(\''+o.id+'\')" style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer">'+
      '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">'+esc(o.nombre)+'</div></div>'+estadoPill(o.estado)+'</div>';
  }).join(''):'<div class="empty" style="padding:12px 14px">No hay obras activas ni pendientes.</div>';
  var obrasBlock='<div class="card" style="padding:0;overflow:hidden;margin-top:14px"><details><summary style="cursor:pointer;padding:14px 16px;font-weight:600;font-size:13px;list-style:none">▸ Obras activas y pendientes · '+obrasAP.length+'</summary><div style="padding-bottom:4px">'+listHtml+'</div></details></div>';
  c.innerHTML=head+'<div class="card" style="padding:0;overflow-x:auto"><table class="cal-table"><thead><tr>'+thead+'</tr></thead><tbody>'+(body||'<tr><td colspan="7" class="empty">No hay empleados cargados.</td></tr>')+'</tbody></table></div>'+
    '<div style="font-size:12px;color:var(--ink-faint);padding:8px 4px">Tocá un día para asignar una tarea. Las tareas del checklist de cada obra también aparecen acá.</div>'+
    obrasBlock;
}

</script>
</body>
</html>
